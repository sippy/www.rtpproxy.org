baseURL: 'https://www.rtpproxy.org/'
locale: en-us
title: RTPProxy
params:
  Subtitle: A high-performance software proxy that brings control to your VoIP network
  description: >-
    RTPProxy is a high-performance, BSD-licensed media relay for SIP networks:
    NAT traversal, IPv4/IPv6 gatewaying, WebRTC (DTLS-SRTP and ICE-lite),
    recording, announcements and more, controlled by OpenSIPS, Kamailio or
    Sippy B2BUA.
  twitter: 'https://twitter.com/sippylabs'
  github: 'https://github.com/sippy/rtpproxy'
  mailinglist: 'https://groups.google.com/forum/#!forum/rtpproxy'
  releases: 'https://github.com/sippy/rtpproxy/releases'
  protocol: 'https://github.com/sippy/rtpproxy/wiki/RTPProxy-Command-Protocol'
  docker: 'https://hub.docker.com/r/sippylabs/rtpproxy'
