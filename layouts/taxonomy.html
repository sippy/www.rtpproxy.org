{{ define "main" }}
<section class="wrap narrow page">
  <header class="page-head">
    <a class="back" href="{{ "post/" | relURL }}">&larr; All news</a>
    <h1>{{ .Title }}</h1>
  </header>
  <nav class="filters">
    {{- range .Data.Terms.ByCount }}
    <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span>{{ .Count }}</span></a>
    {{- end }}
  </nav>
</section>
{{ end }}
